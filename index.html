<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Métricas Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0b6b5f;--teal2:#08544b;--tealbg:#d8f3ec;--bg:#f6f7fb;--line:#e4e7ef;--ink:#12181c;--mut:#5b6670;--red:#c0262d;--redbg:#fde7e8;--amb:#8a5a00;--ambbg:#fff0d0;--grn:#0a7a58;--grnbg:#d8f5ea;--blubg:#e6ebfb;--blu:#35449a;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.shell{display:flex;min-height:100vh}
.side{width:220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none}
.logo{padding:18px 16px;font-weight:700;font-size:16px;display:flex;gap:10px;align-items:center}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--teal);display:inline-block}
.nav{flex:1}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 14px;margin:2px 8px;border-radius:8px;color:var(--ink);cursor:pointer;user-select:none}
.nav a:hover{background:#eef1f6}.nav a.on{background:var(--teal);color:#fff}
.nav .ic{width:18px;text-align:center}
.side-f{padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.side-f button{margin-top:6px}
.main{flex:1;min-width:0}
.top{display:flex;gap:14px;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.seg{display:inline-flex;background:#eef1f6;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--teal);font-weight:600;box-shadow:0 1px 2px #0002}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:#f2f4f9;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.search input{flex:1;border:0;background:transparent;padding:9px 6px;font:inherit;outline:0;min-width:0}
.search kbd{font:11px var(--mono);background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut)}
.sync{font:12px var(--mono);color:var(--mut);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}.dot.off{background:#aaa}
#view{padding:22px 24px 60px;max-width:1500px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.pad{padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:0}h3{font-size:13px;margin:0 0 8px}
.sub{color:var(--mut);margin:0}.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lbl{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.kpis6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .v{font-size:30px;font-weight:700;margin:6px 0;font-variant-numeric:tabular-nums}
.kpi .f{font:12px var(--mono);color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{font:600 11px var(--mono);padding:2px 7px;border-radius:5px;background:#eef1f6;color:var(--mut)}
.chip.up{background:var(--grnbg);color:var(--grn)}.chip.down{background:var(--redbg);color:var(--red)}
table{width:100%;border-collapse:collapse}
th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:10px 12px;background:#f4f6fb;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.num{text-align:right;font-family:var(--mono)}th.num{text-align:right}.ar{text-align:right}
.tag{background:var(--blubg);color:var(--blu);font:600 11px var(--mono);padding:2px 7px;border-radius:5px;white-space:nowrap}
.tag2{background:#eef1f6;font:600 11px var(--mono);padding:2px 7px;border-radius:5px}
.id{font:600 12px var(--mono);color:var(--teal);background:#e4f4f0;padding:2px 6px;border-radius:5px;white-space:nowrap}
.st{font:600 11px var(--mono);padding:2px 8px;border-radius:10px}.st.bad{background:var(--redbg);color:var(--red)}.st.ok{background:var(--grnbg);color:var(--grn)}.st.warn{background:var(--ambbg);color:var(--amb)}
.red{color:var(--red)}.grn{color:var(--grn)}.mono{font-family:var(--mono)}.mut{color:var(--mut)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f2f4f9}.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal2)}
.btn.sm{padding:5px 10px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
.in{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#f8f9fc}
.in:focus{background:#fff;border-color:var(--teal);outline:2px solid #0b6b5f33}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.fl{display:flex;flex-direction:column;gap:5px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.col.off{opacity:.45}
.col-h{padding:12px 14px;background:#f4f6fb;font-weight:600;display:flex;justify-content:space-between}
.fld{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 14px}
.fld input{width:130px;text-align:right;font-family:var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#f4f6fb}
.fld input:focus{background:#fff;border-color:var(--teal);outline:2px solid #0b6b5f33}
.calc{background:#f4f6fb;padding:12px 14px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc b{display:block;font-size:22px;font-family:var(--mono);color:var(--teal)}
.bar{height:6px;background:#e8ecf3;border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--teal)}
.tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;color:var(--mut)}
.tabs button.on{background:#e4f4f0;color:var(--teal);font-weight:600}
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px}
.chart{display:flex;align-items:flex-end;gap:26px;height:190px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.cg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars{display:flex;gap:4px;align-items:flex-end;height:150px;width:100%;justify-content:center}
.bars i{display:block;width:34%;max-width:46px;border-radius:4px 4px 0 0;min-height:2px}
.legend{display:flex;gap:16px;padding:0 16px 10px;font-size:13px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{background:#f4f6fb;border-radius:8px;padding:10px 14px;color:var(--mut);font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.seg-l{display:flex;gap:2px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toast div{background:#12181c;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px #0004;max-width:380px}
#toast div.err{background:var(--red)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:60}
.modal.on{display:flex}.modal .box{background:#fff;border-radius:14px;padding:24px;width:min(520px,92vw);max-height:90vh;overflow:auto}
.hide{display:none!important}
@media print{.side,.top,.btn,#toast{display:none!important}#view{padding:0}}
@media(max-width:1100px){.cols3,.kpis,.kpis6,.g4,.g3{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo"><i></i>Métricas Video</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f"><span id="modeLbl"></span><br><button class="btn sm" onclick="App.showConnect()">Conexión</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="seg" id="brandSeg"></div>
      <div class="search"><span>⌕</span><input id="q" placeholder="Pega ID (ej. AFZ_V_0017) o link de publicación (IG, FB, TT)…" onkeydown="if(event.key==='Enter')App.search(this.value)"><kbd>Enter</kbd></div>
      <div class="sync"><span class="dot off" id="syncDot"></span><span id="syncLbl">Sin conexión</span><button class="btn sm" onclick="App.refresh()" title="Recargar datos">↻</button></div>
      <div class="mono mut" id="todayLbl"></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
'use strict';
/* ================= utilidades ================= */
const REDES=['IG','FB','TT'];
const RED_NAME={IG:'Instagram',FB:'Facebook',TT:'TikTok'};
const CORTES=['15D','1M','CIERRE'];
const CIERRE_DESDE=new Date(2026,9,1); /* el corte CIERRE solo se exige a videos publicados desde esta fecha */
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const FIELDS=[['VISUALIZACIONES','Visualizaciones','vis'],['ALCANCE','Alcance','alc'],['LIKES','Likes','likes'],['COMENTARIOS','Comentarios','com'],['COMPARTIDOS','Compartidos','comp'],['REPOST','Repost','rep'],['GUARDADOS','Guardados','guard'],['TIEMPO_REPRO_S','T. promedio (s)','t']];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/[,\s%]/g,''));return isNaN(n)?null:n;};
const nf=new Intl.NumberFormat('es-MX',{maximumFractionDigits:0});
const fN=v=>v==null?'—':nf.format(Math.round(v));
const fP=v=>v==null?'—':v.toFixed(2)+'%';
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fD=d=>d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—';
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function addMonths(d,n){const x=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d.getDate(),last));return x;}
function parseDate(s){if(!s)return null;s=String(s).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);return null;}
function dueDate(v,c){const p=v.pub;if(!p)return null;if(c==='15D')return addDays(p,15);if(c==='1M')return addMonths(p,1);return new Date(p.getFullYear(),p.getMonth()+1,1);}
function chip(delta,unit){if(delta==null||!isFinite(delta))return '<span class="chip">—</span>';const up=delta>=0;return `<span class="chip ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(delta).toFixed(unit==='pp'?2:1)}${unit==='pp'?' pp':'%'}</span>`;}
const pct=(a,b)=>(a==null||b==null||b===0)?null:(a-b)/b*100;
const pp=(a,b)=>(a==null||b==null)?null:a-b;
function toast(msg,err){const d=document.createElement('div');d.textContent=msg;if(err)d.className='err';$('#toast').appendChild(d);setTimeout(()=>d.remove(),err?6000:3200);}
function csv(name,rows){const body=rows.map(r=>r.map(c=>{c=c==null?'':String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+body],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}

/* ================= estado ================= */
const S={cfg:{url:'',token:''},demo:false,videos:[],metricas:[],config:{},view:'inicio',params:{},brand:'Ambas',loaded:false,lastSync:null,win:60,pf:'Todos',q:'',cap:null,fs:null,
 sinReg:new Set(),sel:new Set(),showSR:false,
 rank:{metric:'vis',period:'30d',red:'Todas',tipo:'Todos',creador:''},cmp:{a:'mes',b:'mes_ant',red:'Todas',aFrom:'',aTo:'',bFrom:'',bTo:''},vMap:new Map(),mMap:new Map(),error:''};

/* ================= datos y cálculos ================= */
function metricObj(m){const g=k=>num(m[k]);return {vis:g('VISUALIZACIONES'),alc:g('ALCANCE'),likes:g('LIKES'),com:g('COMENTARIOS'),comp:g('COMPARTIDOS'),rep:g('REPOST'),guard:g('GUARDADOS'),t:g('TIEMPO_REPRO_S')};}
function calc(n,dur){const inter=['likes','com','comp','rep','guard'].reduce((s,k)=>s+(n[k]||0),0);return {inter,eng:n.alc>0?inter/n.alc*100:null,ret:(dur>0&&n.t!=null)?n.t/dur*100:null};}
function parseRedes(v){let r=String(v.REDES||'').toUpperCase().split(/[,\s;/]+/).filter(x=>REDES.includes(x));if(!r.length){if(v.LINK_IG)r.push('IG');if(v.LINK_FB)r.push('FB');if(v.LINK_TT)r.push('TT');}return r;}
function buildIndex(){
  S.vMap=new Map();
  S.videos.forEach(v=>{v.dur=num(v.DURACION_S);v.pub=parseDate(v.FECHA_PUBLICACION);v.redes=parseRedes(v);S.vMap.set(v.ID_VIDEO,v);});
  S.mMap=new Map();
  S.metricas.forEach(m=>{const v=S.vMap.get(m.ID_VIDEO);const n=metricObj(m);const c=calc(n,v?v.dur:null);S.mMap.set(m.ID_VIDEO+'|'+m.RED+'|'+m.CORTE,{red:m.RED,corte:m.CORTE,fecha:m.FECHA_CAPTURA,n,inter:c.inter,eng:c.eng,ret:c.ret});});
}
const getM=(id,red,c)=>S.mMap.get(id+'|'+red+'|'+c);
const pKey=(id,red,c)=>id+'|'+red+'|'+c;
const selCount=list=>list.filter(x=>S.sel.has(pKey(x.v.ID_VIDEO,x.red,x.corte))).length;
function srList(){const out=[];S.sinReg.forEach(k=>{const [id,red,corte]=k.split('|');const v=S.vMap.get(id);if(!v)return;if(S.brand!=='Ambas'&&v.MARCA!==S.brand)return;out.push({k,v,red,corte});});out.sort((a,b)=>a.v.ID_VIDEO.localeCompare(b.v.ID_VIDEO)||a.corte.localeCompare(b.corte)||a.red.localeCompare(b.red));return out;}
function latest(id,red){for(let i=CORTES.length-1;i>=0;i--){const m=getM(id,red,CORTES[i]);if(m)return m;}return getM(id,red,'7D')||null;}
const brandVideos=()=>S.brand==='Ambas'?S.videos:S.videos.filter(v=>v.MARCA===S.brand);
function statRows(vids,redF){const out=[];for(const v of vids){for(const r of v.redes){if(redF&&redF!=='Todas'&&r!==redF)continue;const m=latest(v.ID_VIDEO,r);if(m)out.push({v,red:r,corte:m.corte,n:m.n,inter:m.inter,eng:m.eng,ret:m.ret});}}return out;}
function agg(rows){
  const sum=k=>rows.reduce((s,r)=>s+(r.n[k]||0),0);
  const wa=rows.filter(r=>r.n.alc>0);const iA=wa.reduce((s,r)=>s+r.inter,0),aA=wa.reduce((s,r)=>s+r.n.alc,0);
  const rets=rows.filter(r=>r.ret!=null);
  return {vis:sum('vis'),alc:sum('alc'),inter:rows.reduce((s,r)=>s+r.inter,0),eng:aA>0?iA/aA*100:null,ret:rets.length?rets.reduce((s,r)=>s+r.ret,0)/rets.length:null,n:rows.length};
}
function pendientes(){
  const today=sod(new Date());const minPub=S.win?addDays(today,-S.win):null;const out=[];
  for(const v of brandVideos()){
    if(!v.pub)continue;if(minPub&&v.pub<minPub)continue;
    for(const r of v.redes)for(const c of CORTES){
      const d=dueDate(v,c);if(!d||d>today)continue;if(c==='CIERRE'&&v.pub<CIERRE_DESDE)continue;if(getM(v.ID_VIDEO,r,c))continue;if(S.sinReg.has(pKey(v.ID_VIDEO,r,c)))continue;
      out.push({v,red:r,corte:c,due:d,state:d<today?'Vencido':'Hoy'});
    }
  }
  out.sort((a,b)=>a.due-b.due||a.v.ID_VIDEO.localeCompare(b.v.ID_VIDEO));return out;
}
function defaultCorte(v){const today=sod(new Date());for(const c of CORTES){const d=dueDate(v,c);if(d&&d<=today&&v.redes.some(r=>!getM(v.ID_VIDEO,r,c)))return c;}return '15D';}
function nextId(marca){let max=0;const re=new RegExp('^'+marca+'_V_(\\d+)$');S.videos.forEach(v=>{const m=String(v.ID_VIDEO).match(re);if(m)max=Math.max(max,+m[1]);});return marca+'_V_'+String(max+1).padStart(4,'0');}
function brandName(c){const m=(S.config.MARCA||[]),n=(S.config.NOMBRE_MARCA||[]);const i=m.indexOf(c);return i>=0&&n[i]?n[i]:({AFZ:'Afinazone',OCF:'Omova Carbon Fiber'}[c]||c);}
function opts(cfgKey,field){const s=new Set((S.config[cfgKey]||[]));S.videos.forEach(v=>{if(v[field])s.add(v[field]);});return [...s];}
const dl=(id,list)=>`<datalist id="${id}">${list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;

/* periodos */
const PERIODS=[['mes','Este mes'],['mes_ant','Mes anterior'],['30d','Últimos 30 días'],['30d_ant','30 días previos'],['90d','Últimos 90 días'],['sem','Esta semana'],['sem_ant','Semana anterior'],['anio','Este año'],['anio_ant','Año anterior'],['todo','Todo el historial'],['custom','Rango libre…']];
function periodRange(k,from,to){
  const t=sod(new Date()),y=t.getFullYear(),m=t.getMonth();const dow=(t.getDay()+6)%7;
  switch(k){
    case 'mes':return [new Date(y,m,1),new Date(y,m+1,0)];
    case 'mes_ant':return [new Date(y,m-1,1),new Date(y,m,0)];
    case '30d':return [addDays(t,-29),t];
    case '30d_ant':return [addDays(t,-59),addDays(t,-30)];
    case '90d':return [addDays(t,-89),t];
    case 'anio':return [new Date(y,0,1),new Date(y,11,31)];
    case 'anio_ant':return [new Date(y-1,0,1),new Date(y-1,11,31)];
    case 'sem':{const s=addDays(t,-dow);return [s,addDays(s,6)];}
    case 'sem_ant':{const s=addDays(t,-dow-7);return [s,addDays(s,6)];}
    case 'custom':return [parseDate(from),parseDate(to)];
    default:return [null,null];
  }
}
function inRange(d,r){if(!d)return false;if(r[0]&&d<r[0])return false;if(r[1]&&d>r[1])return false;return true;}
const rangeLbl=r=>r[0]&&r[1]?fD(r[0])+' – '+fD(r[1]):'Todo el historial';

/* ================= API ================= */
async function api(action,payload){
  if(S.demo)return demoApi(action,payload||{});
  if(!S.cfg.url||!S.cfg.token)throw new Error('Falta conectar la hoja.');
  const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.cfg.token,action,payload:payload||{}})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Error desconocido');return j;
}
async function loadData(){
  S.error='';setSync('Cargando…',false);
  try{const j=await api('data');S.videos=j.data.videos||[];S.metricas=j.data.metricas||[];S.config=j.data.config||{};S.sinReg=new Set((j.data.sinRegistro||[]).map(x=>x.CLAVE));S.sel=new Set();buildIndex();S.loaded=true;S.lastSync=new Date();setSync((S.demo?'Demo · ':'Sincronizado ')+pad(S.lastSync.getHours())+':'+pad(S.lastSync.getMinutes()),true);}

const DEMO={videos:[],metricas:[],config:{}};
function makeDemo(){
  const t=sod(new Date());let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const temas={AFZ:['Mitos del aceite sintético','Cambio de pastillas cerámicas','Diagnóstico con scanner OBD2','Lavado de inyectores','Calibración de bujías','Prueba de compresión','Purga de frenos'],OCF:['Alerón de fibra de carbono','Volante deportivo custom','Difusor trasero real carbon','Lip frontal en autoclave','Capó ventilado','Tratamiento cerámico para fibra','Prueba de torsión de chasis']};
  const ago=[1,3,6,9,12,15,17,21,26,31,38,44,52,58];const videos=[],metricas=[];
  ago.forEach((d,i)=>{
    const marca=i%2?'OCF':'AFZ';const k=Math.floor(i/2);const id=marca+'_V_'+String((marca==='OCF'?200:10)+k).padStart(4,'0');
    const pub=addDays(t,-d);const redes=i%3===0?['IG','TT']:['IG','FB','TT'];const collab=i%5===0;
    videos.push({ID_VIDEO:id,MARCA:marca,FECHA_PUBLICACION:iso(pub),HORA_PUBLICACION:i%2?'18:00':'15:00',SEGMENTO:['GENERAL','MIN','MAY','MED'][i%4],TEMA:temas[marca][k%temas[marca].length],FORMATO:['Tip','Proceso','Resultados'][i%3],OBJETIVO:['EDUCAR','ATRAER','CONFIAR','VENTAS'][i%4],DESTINO_CTA:i%2?'WEB':'REDES',PRODUCTO:marca==='OCF'?'Kit omova':'KAT',PUBLICO_OBJETIVO:'Nuevos',DURACION_S:String(30+Math.floor(rnd()*60)),TIPO:collab?'Colaboración':'Propio',CREADOR:collab?'BYND Academy':'',REDES:redes.join(','),LINK_IG:'https://www.instagram.com/reel/DEMO'+id+'/',LINK_FB:redes.includes('FB')?'https://www.facebook.com/watch/?v='+(1000+i):'',LINK_TT:'https://www.tiktok.com/@marca/video/73821'+(1000+i),NOTAS:'',CREADO_EN:iso(pub)+'T10:00:00'});
    const dur=+videos[videos.length-1].DURACION_S;
    CORTES.forEach((c,ci)=>{
      const due=dueDate({pub},c);if(!(due<=addDays(t,-3)))return;if(rnd()<0.12)return;
      redes.forEach(r=>{
        const base=(300+rnd()*3000)*(r==='TT'?1.8:r==='FB'?0.5:1)*(1+ci*0.25);
        const alc=Math.round(base),vis=Math.round(base*(1.5+rnd()));
        const lk=Math.round(alc*(0.02+rnd()*0.06));
        metricas.push({CLAVE:id+'|'+r+'|'+c,ID_VIDEO:id,RED:r,CORTE:c,FECHA_CAPTURA:iso(due),VISUALIZACIONES:String(vis),ALCANCE:String(alc),LIKES:String(lk),COMENTARIOS:String(Math.round(lk*0.12)),COMPARTIDOS:String(Math.round(lk*0.2)),REPOST:String(Math.round(lk*0.05)),GUARDADOS:String(Math.round(lk*0.25)),TIEMPO_REPRO_S:(dur*(0.25+rnd()*0.4)).toFixed(1),CAPTURADO_EN:iso(due)+'T12:00:00'});
      });
    });
  });
  DEMO.videos=videos;DEMO.metricas=metricas;
  DEMO.config={MARCA:['AFZ','OCF'],NOMBRE_MARCA:['Afinazone','Omova Carbon Fiber'],SEGMENTO:['GENERAL','PÚB. GRAL','MAY','MIN','MED'],OBJETIVO:['CONFIAR','EDUCAR','VENTAS','ATRAER'],FORMATO:['Problema común','Tip','Proceso','Resultados'],DESTINO_CTA:['REDES','WEB','N/A'],PRODUCTO:['KAT','Kit omova','Combo de 1 metro'],PUBLICO_OBJETIVO:['Nuevos','Actuales']};
}
function demoApi(action,p){
  return new Promise(res=>setTimeout(()=>{
    if(action==='data')return res({ok:true,data:JSON.parse(JSON.stringify({videos:DEMO.videos,metricas:DEMO.metricas,config:DEMO.config,sinRegistro:DEMO.sinReg||[]}))});
    if(action==='markSinRegistro'){DEMO.sinReg=DEMO.sinReg||[];p.items.forEach(i=>{const k=pKey(i.ID_VIDEO,i.RED,i.CORTE);if(!DEMO.sinReg.some(x=>x.CLAVE===k))DEMO.sinReg.push({CLAVE:k,...i});});return res({ok:true});}
    if(action==='unmarkSinRegistro'){const ks=p.items.map(i=>pKey(i.ID_VIDEO,i.RED,i.CORTE));DEMO.sinReg=(DEMO.sinReg||[]).filter(x=>!ks.includes(x.CLAVE));return res({ok:true});}
    if(action==='addVideo'){DEMO.videos.push({...p.video});return res({ok:true});}
    if(action==='updateVideo'){const i=DEMO.videos.findIndex(v=>v.ID_VIDEO===p.video.ID_VIDEO);if(i>=0)DEMO.videos[i]={...DEMO.videos[i],...p.video};return res({ok:true});}
    if(action==='saveMetricas'){for(const r of REDES){const d=p.redes[r];if(!d)continue;const k=p.ID_VIDEO+'|'+r+'|'+p.CORTE;DEMO.metricas=DEMO.metricas.filter(m=>m.CLAVE!==k);DEMO.metricas.push({CLAVE:k,ID_VIDEO:p.ID_VIDEO,RED:r,CORTE:p.CORTE,FECHA_CAPTURA:p.FECHA_CAPTURA,...Object.fromEntries(Object.entries(d).map(([a,b])=>[a,String(b)]))});}return res({ok:true});}
    res({ok:true});
  },60));
}

const normUrl=u=>String(u||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^(www|m|vm)\./,'').split('?')[0].split('#')[0].replace(/\/+$/,'');
function findVideos(q){
  q=String(q||'').trim();if(!q)return [];const ql=q.toLowerCase();
  const exact=S.videos.filter(v=>String(v.ID_VIDEO).toLowerCase()===ql);if(exact.length)return exact;
  if(/^https?:\/\//i.test(q)||/(instagram|facebook|fb\.watch|tiktok)\./i.test(q)){
    const n=normUrl(q);const hit=S.videos.filter(v=>['LINK_IG','LINK_FB','LINK_TT'].some(k=>v[k]&&(normUrl(v[k])===n||normUrl(v[k]).includes(n)||n.includes(normUrl(v[k])))));
    // facebook.com/watch/?v=ID: la parte del query importa
    if(hit.length)return hit;
    const m=q.match(/[?&]v=(\d+)/);if(m)return S.videos.filter(v=>String(v.LINK_FB||'').includes(m[1]));
    return [];
  }
  return S.videos.filter(v=>String(v.ID_VIDEO).toLowerCase().includes(ql)||String(v.TEMA||'').toLowerCase().includes(ql)).slice(0,25);
}
function brandAvg(v,red,corte){

  const mean=f=>{const xs=rows.map(f).filter(x=>x!=null);return xs.length?xs.reduce((s,x)=>s+x,0)/xs.length:null;};
  return {alc:mean(m=>m.n.alc),likes:mean(m=>m.n.likes),eng:mean(m=>m.eng),ret:mean(m=>m.ret),n:rows.length};
}

const RMET={vis:['Más vistas',r=>r.n.vis],eng:['Mejor engagement',r=>r.eng],ret:['Mejor retención',r=>r.ret],likes:['Más likes',r=>r.n.likes],inter:['Más interacciones',r=>r.inter]};

/* ================= Comparar ================= */
function cmpData(key,from,to){
  const rg=periodRange(key,from,to);const vids=brandVideos().filter(v=>key==='todo'||inRange(v.pub,rg));
  const rows=statRows(vids,S.cmp.red);const a=agg(rows);a.videos=vids.length;a.rows=rows;a.range=rg;a.buckets=buckets(rg,rows);return a;
}
function buckets(rg,rows){
  const [s,e]=rg;if(!s||!e)return [];const span=Math.round((e-s)/864e5)+1;const monthly=span>62;
  const n=monthly?((e.getFullYear()-s.getFullYear())*12+e.getMonth()-s.getMonth()+1):Math.ceil(span/7);
  const out=Array.from({length:n},(_,i)=>({label:monthly?MESES[(s.getMonth()+i)%12]:'Sem '+(i+1),vis:0}));
  rows.forEach(r=>{if(!r.v.pub)return;const i=monthly?((r.v.pub.getFullYear()-s.getFullYear())*12+r.v.pub.getMonth()-s.getMonth()):Math.floor(Math.round((r.v.pub-s)/864e5)/7);if(out[i])out[i].vis+=r.n.vis||0;});return out;
}
function periodSel(side){
  const C=S.cmp;const k=C[side];
  return `<div class="fl"><span class="lbl">Periodo ${side==='a'?'A (base)':'B (comparado)'}</span><select class="in" onchange="App.cset('${side}',this.value)">${PERIODS.map(([v,l])=>`<option value="${v}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>${k==='custom'?`<div style="display:flex;gap:6px"><input class="in" type="date" value="${esc(C[side+'From'])}" onchange="App.cset('${side}From',this.value)"><input class="in" type="date" value="${esc(C[side+'To'])}" onchange="App.cset('${side}To',this.value)"></div>`:''}</div>`;
}
function viewComparar(){
  const C=S.cmp;const A=cmpData(C.a,C.aFrom,C.aTo),B=cmpData(C.b,C.bFrom,C.bTo);
  const nb=Math.max(A.buckets.length,B.buckets.length);const mx=Math.max(1,...A.buckets.map(x=>x.vis),...B.buckets.map(x=>x.vis));
  const K=[['Videos publicados',A.videos,B.videos,fN,'%'],['Vistas totales',A.vis,B.vis,fN,'%'],['Alcance neto',A.alc,B.alc,fN,'%'],['Engagement prom.',A.eng,B.eng,fP,'pp'],['Retención prom.',A.ret,B.ret,fP,'pp'],['Interacciones',A.inter,B.inter,fN,'%']];
  const top5=(P)=>P.rows.slice().sort((x,y)=>(y.n.vis||0)-(x.n.vis||0)).slice(0,5);
  const tbl=(P)=>`<table><thead><tr><th>Video / red</th><th>Marca</th><th class="num">Vistas</th><th class="num">Eng. %</th><th class="num">Ret. %</th></tr></thead><tbody>${top5(P).map(r=>`<tr><td><span class="id">${esc(r.v.ID_VIDEO)}</span> <span class="mut">${r.red}</span></td><td><span class="tag">${esc(r.v.MARCA)}</span></td><td class="num">${fN(r.n.vis)}</td><td class="num">${fP(r.eng)}</td><td class="num">${fP(r.ret)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Sin métricas capturadas</td></tr>'}</tbody></table>`;
  const concl=(()=>{const d=pct(A.vis,B.vis);if(d==null)return 'Aún no hay métricas suficientes en ambos periodos para concluir.';const dv=A.videos-B.videos;return `El periodo A tiene ${Math.abs(d).toFixed(1)}% ${d>=0?'más':'menos'} vistas que el B, con ${Math.abs(dv)} publicaciones ${dv>=0?'más':'menos'}${A.eng!=null&&B.eng!=null?`; el engagement ${A.eng>=B.eng?'sube':'baja'} ${Math.abs(A.eng-B.eng).toFixed(2)} pp`:''}${A.ret!=null&&B.ret!=null?` y la retención ${A.ret>=B.ret?'sube':'baja'} ${Math.abs(A.ret-B.ret).toFixed(2)} pp`:''}.`;})();
  return `<div class="ph"><div><h1>Comparar periodos</h1><p class="sub">Marca: ${S.brand==='Ambas'?'AFZ + OCF':S.brand} (cámbiala arriba). Los videos se asignan al periodo por su fecha de publicación y se usa su último corte capturado.</p></div></div>
  <section class="card pad"><div class="grid g4" style="align-items:start">${periodSel('a')}${periodSel('b')}<div class="fl"><span class="lbl">Red</span><div class="seg">${['Todas','IG','FB','TT'].map(r=>`<button class="${C.red===r?'on':''}" onclick="App.cset('red','${r}')">${r}</button>`).join('')}</div></div></div>
   <p class="mono mut" style="font-size:12px;margin:12px 0 0">A: ${rangeLbl(A.range)} · B: ${rangeLbl(B.range)}</p></section>
  <div class="kpis6">${K.map(([l,a,b,fm,u])=>`<div class="kpi"><div class="lbl">${l}</div><div class="v">${fm(a)} ${chip(u==='pp'?pp(a,b):pct(a,b),u)}</div><div class="f"><span>Periodo B: ${fm(b)}</span></div></div>`).join('')}</div>
  <section class="card"><div class="card-h"><h2>Vistas por ${A.buckets.length&&A.range[1]&&Math.round((A.range[1]-A.range[0])/864e5)>62?'mes':'semana'} de publicación</h2></div>
   <div class="legend"><span><b style="background:var(--teal)"></b>Periodo A (${fN(A.vis)})</span><span><b style="background:#5b6b87"></b>Periodo B (${fN(B.vis)})</span></div>
   ${nb?`<div class="chart">${Array.from({length:nb},(_,i)=>{const a=A.buckets[i],b=B.buckets[i];return `<div class="cg"><div class="bars"><i style="height:${a?Math.round(a.vis/mx*150):0}px;background:var(--teal)" title="A: ${fN(a?a.vis:0)}"></i><i style="height:${b?Math.round(b.vis/mx*150):0}px;background:#5b6b87" title="B: ${fN(b?b.vis:0)}"></i></div><span class="mono" style="font-size:12px">${esc((a||b).label)}</span></div>`;}).join('')}</div>`:'<div class="empty">Elige un periodo con fechas para ver la gráfica.</div>'}</section>
  <div class="grid g2"><section class="card"><div class="card-h"><h2>Top 5 · Periodo A</h2><span class="st ok">${A.videos} videos</span></div>${tbl(A)}</section><section class="card"><div class="card-h"><h2>Top 5 · Periodo B</h2><span class="st ok">${B.videos} videos</span></div>${tbl(B)}</section></div>
  <div class="note"><b>Conclusión:</b> ${concl}</div>
  <p style="margin-top:12px"><button class="btn" onclick="App.exportCmp()">⭳ Exportar CSV</button> <button class="btn" onclick="window.print()">🖨 Imprimir informe</button></p>`;
}

/* ================= Colaboraciones / Guiones ================= */
function viewColabs(){
  const vids=S.videos.filter(v=>v.TIPO==='Colaboración');const g={};
  vids.forEach(v=>{const k=v.CREADOR||'(sin creador)';(g[k]=g[k]||[]).push(v);});
  const rows=Object.entries(g).map(([k,vs])=>{const a=agg(statRows(vs));return {k,vs,a,brands:[...new Set(vs.map(v=>v.MARCA))].join(', ')};}).sort((x,y)=>y.a.vis-x.a.vis);
  return `<div class="ph"><div><h1>Colaboraciones</h1><p class="sub">Resumen por creador, calculado con tus videos marcados como “Colaboración”.</p></div></div>
  <section class="card">${rows.length?`<table><thead><tr><th>Creador</th><th>Marca</th><th class="num">Videos</th><th class="num">Vistas</th><th class="num">Alcance</th><th class="num">Eng. %</th><th class="num">Ret. %</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.k)}</b></td><td><span class="tag">${esc(r.brands)}</span></td><td class="num">${r.vs.length}</td><td class="num">${fN(r.a.vis)}</td><td class="num">${fN(r.a.alc)}</td><td class="num">${fP(r.a.eng)}</td><td class="num">${fP(r.a.ret)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aún no hay videos de colaboración. Márcalos como “Colaboración” y escribe el creador al dar de alta el video.</div>'}</section>
  <div class="note">La evaluación de creadores (criterios de seguidores y vistas, proyecto, estatus) y el registro de entregables llegan en la siguiente etapa, leyendo tu hoja de evaluación.</div>`;
}
function viewGuiones(){
  const L=JSON.parse(localStorage.getItem('mv_docs')||'{}');const id=S.params.id;
  const f=(k,l)=>`<label class="fl"><span class="lbl">${l}</span><div style="display:flex;gap:8px"><input class="in" id="doc_${k}" value="${esc(L[k]||'')}" placeholder="https://docs.google.com/document/…" onchange="App.saveDocs()"><a class="btn" target="_blank" rel="noopener" href="${esc(L[k]||'#')}" ${L[k]?'':'onclick="return false" style="opacity:.5"'}>Abrir</a></div></label>`;
  return `<div class="ph"><div><h1>Guiones y lineamientos</h1><p class="sub">${id?`Guion de ${esc(id)}: ábrelo en el documento de guiones de su marca (hay una pestaña con ese ID).`:'Accesos directos a tus documentos.'}</p></div></div>
  <section class="card pad"><div class="grid" style="gap:14px">${f('lin','Lineamientos de colaboración')}${f('ocf','Guiones Omova Carbon Fiber')}${f('afz','Guiones Afinazone')}</div><p class="mut" style="margin:12px 0 0">Los links se guardan solo en este navegador (no en la página pública). En la siguiente etapa la página leerá los guiones y los mostrará aquí junto a cada video.</p></section>`;
}

/* ================= acciones ================= */
const App={
  go,
  toggleSR(){S.showSR=!S.showSR;render();},
  selOne(el){if(el.checked)S.sel.add(el.dataset.k);else S.sel.delete(el.dataset.k);render();},
  selAll(on){const shown=pendientes().filter(x=>S.pf==='Todos'||x.corte===S.pf).slice(0,150);shown.forEach(x=>{const k=pKey(x.v.ID_VIDEO,x.red,x.corte);if(on)S.sel.add(k);else S.sel.delete(k);});render();},
  async _mark(items,msg){
    if(!items.length){toast('No hay nada seleccionado.',true);return;}
    if(items.length>1&&!confirm(msg.replace('{n}',items.length)))return;
    try{await api('markSinRegistro',{items});items.forEach(i=>{const k=pKey(i.ID_VIDEO,i.RED,i.CORTE);S.sinReg.add(k);S.sel.delete(k);});toast(items.length+' marcado(s) sin registro de métricas.');render();}
    catch(e){toast('No se guardó: '+e.message,true);}
  },
  srOne(el){App._mark([{ID_VIDEO:el.dataset.id,RED:el.dataset.red,CORTE:el.dataset.c}],'');},
  srVideo(el){const id=el.dataset.id;const items=pendientes().filter(x=>x.v.ID_VIDEO===id).map(x=>({ID_VIDEO:id,RED:x.red,CORTE:x.corte}));App._mark(items,'Se marcarán {n} cortes pendientes de este video como sin registro. ¿Continuar?');},
  srSelected(){const items=pendientes().filter(x=>S.sel.has(pKey(x.v.ID_VIDEO,x.red,x.corte))).map(x=>({ID_VIDEO:x.v.ID_VIDEO,RED:x.red,CORTE:x.corte}));App._mark(items,'Se marcarán {n} pendientes como sin registro. ¿Continuar?');},
  srAllShown(){const items=pendientes().filter(x=>S.pf==='Todos'||x.corte===S.pf).map(x=>({ID_VIDEO:x.v.ID_VIDEO,RED:x.red,CORTE:x.corte}));App._mark(items,'Se marcarán {n} pendientes (todos los mostrados, no solo los visibles en pantalla) como sin registro. ¿Continuar?');},
  async _unmark(items){
    try{await api('unmarkSinRegistro',{items});items.forEach(i=>S.sinReg.delete(pKey(i.ID_VIDEO,i.RED,i.CORTE)));toast(items.length+' devuelto(s) a pendientes.');render();}
    catch(e){toast('No se guardó: '+e.message,true);}
  },
  unSrOne(el){App._unmark([{ID_VIDEO:el.dataset.id,RED:el.dataset.red,CORTE:el.dataset.c}]);},
  unSrAll(){const items=srList().map(x=>({ID_VIDEO:x.v.ID_VIDEO,RED:x.red,CORTE:x.corte}));if(!items.length)return;if(!confirm('Se devolverán '+items.length+' cortes a la lista de pendientes. ¿Continuar?'))return;App._unmark(items);},
  setBrand(b){S.brand=b;render();},
  setWin(v){S.win=+v;render();},setPf(c){S.pf=c;render();},
  search(q){S.q=q;go('buscar',{q});},
  async refresh(){if(S.loaded||S.demo||S.cfg.url)await loadData();else render();},
  capFromPending(el){go('capturar',{id:el.dataset.id,corte:el.dataset.c,red:el.dataset.red,fromPending:true});},
  capPick(id){id=id.trim();if(!S.vMap.has(id)){toast('No encuentro ese ID.',true);return;}go('capturar',{id});},
  capCorte(c){if(S.cap){S.cap.corte=c;S.cap.focus=null;render();}},
  capClear(){document.querySelectorAll('#view input[data-red]').forEach(i=>i.value='');['IG','FB','TT'].forEach(App.liveCalc);const f=document.querySelector('#view input[data-red]:not([disabled])');if(f)f.focus();},
  liveCalc(r){const v=S.vMap.get(S.cap.id);const c=readCol(r);const n={vis:c.vis,alc:c.alc,likes:c.likes,com:c.com,comp:c.comp,rep:c.rep,guard:c.guard,t:c.t};const el=$('#calc_'+r);if(el)el.innerHTML=calcPanel(n,v.dur);},
  capKey(e){
    if(e.key!=='Enter')return;e.preventDefault();
    const list=[...document.querySelectorAll('#view input[data-red]:not([disabled])')];const i=list.indexOf(e.target);
    if(e.ctrlKey||i===list.length-1)App.capSave();else list[i+1].focus();
  },
  capNext(){const l=pendientes();if(!l.length){toast('No hay más pendientes.');go('inicio');return;}const cur=S.cap?S.cap.id+'|'+S.cap.corte:'';const x=l.find(p=>p.v.ID_VIDEO+'|'+p.corte!==cur)||l[0];go('capturar',{id:x.v.ID_VIDEO,corte:x.corte,red:x.red,fromPending:true});},
  async capSave(){
    const cap=S.cap;const v=cap&&S.vMap.get(cap.id);if(!v)return;
    const redes={};let bad=null,warn=false;
    for(const r of REDES){
      if(!v.redes.includes(r))continue;const c=readCol(r);
      for(const [K,,key] of FIELDS){if(c['_raw_'+key]!==''&&c[key]==null){bad=`${RED_NAME[r]}: “${c['_raw_'+key]}” no es un número.`;break;}if(c[key]!=null&&c[key]<0){bad=`${RED_NAME[r]}: no puede haber valores negativos.`;break;}}
      if(bad)break;if(!c._any)continue;
      if(c.alc==null&&c.vis==null){bad=`${RED_NAME[r]}: captura al menos visualizaciones o alcance.`;break;}
      if(v.dur&&c.t!=null&&c.t>v.dur)warn=true;
      redes[r]=Object.fromEntries(FIELDS.map(([K,,key])=>[K,c[key]==null?0:c[key]]));
    }
    if(bad){toast(bad,true);return;}
    if(!Object.keys(redes).length){toast('No hay datos para guardar.',true);return;}
    if(warn&&!confirm('El tiempo promedio es mayor que la duración del video. ¿Guardar de todos modos?'))return;
    const btn=$('#capSaveBtn');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
    const fecha=($('#capFecha')||{}).value||iso(sod(new Date()));
    try{
      await api('saveMetricas',{ID_VIDEO:v.ID_VIDEO,CORTE:cap.corte,FECHA_CAPTURA:fecha,redes});
      for(const r of Object.keys(redes)){const key=v.ID_VIDEO+'|'+r+'|'+cap.corte;S.sinReg.delete(key);S.metricas=S.metricas.filter(m=>m.CLAVE!==key);S.metricas.push({CLAVE:key,ID_VIDEO:v.ID_VIDEO,RED:r,CORTE:cap.corte,FECHA_CAPTURA:fecha,...Object.fromEntries(Object.entries(redes[r]).map(([a,b])=>[a,String(b)]))});}
      buildIndex();toast('Guardado: '+v.ID_VIDEO+' · '+cap.corte+' · '+Object.keys(redes).join(', '));
      if(cap.fromPending){const l=pendientes();if(l.length){const x=l[0];go('capturar',{id:x.v.ID_VIDEO,corte:x.corte,red:x.red,fromPending:true});return;}toast('No quedan pendientes.');go('inicio');return;}
      S._noFocus=true;render();S._noFocus=false;
    }catch(e){toast('No se guardó: '+e.message,true);if(btn){btn.disabled=false;btn.textContent='✔ Guardar todo';}}
  },
  fSeg(kind,el){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on');
    if(kind==='tipo')$('#creBox').classList.toggle('hide',el.dataset.v!=='Colaboración');
    if(kind==='marca'){const idEl=$('#f_ID');if(idEl&&!idEl.readOnly&&!idEl.dataset.touched)idEl.value=nextId(el.dataset.v);}},
  linkCheck(r){const s=linkState(r,($('#url_'+r)||{}).value);const el=$('#lk_'+r);if(el){el.textContent=s==='ok'?'✔ Válido':s==='bad'?'⚠ Revisar':'';el.style.color=s==='ok'?'var(--grn)':s==='bad'?'var(--red)':'';}},
  async saveVideo(thenCapture){
    const edit=!!S.params.edit;const g=id=>($('#'+id).value||'').trim();
    const marca=$('#segMarca .on').dataset.v,tipo=$('#segTipo .on').dataset.v;
    const redes=REDES.filter(r=>$('#chk_'+r).checked);
    const v={ID_VIDEO:g('f_ID'),MARCA:marca,FECHA_PUBLICACION:g('f_FECHA'),HORA_PUBLICACION:g('f_HORA'),SEGMENTO:g('f_SEG'),TEMA:g('f_TEMA'),FORMATO:g('f_FMT'),OBJETIVO:g('f_OBJ'),DESTINO_CTA:g('f_DES'),PRODUCTO:g('f_PROD'),PUBLICO_OBJETIVO:g('f_PUB'),DURACION_S:g('f_DUR'),TIPO:tipo,CREADOR:tipo==='Colaboración'?g('f_CRE'):'',REDES:redes.join(','),LINK_IG:g('url_IG'),LINK_FB:g('url_FB'),LINK_TT:g('url_TT')};
    if(!/^[A-Za-z0-9_\-]+$/.test(v.ID_VIDEO))return toast('El ID solo puede llevar letras, números, guion y guion bajo.',true);
    if(!edit&&S.vMap.has(v.ID_VIDEO))return toast('Ya existe un video con ese ID.',true);
    if(!parseDate(v.FECHA_PUBLICACION))return toast('Falta la fecha de publicación.',true);
    if(v.DURACION_S!==''&&num(v.DURACION_S)==null)return toast('La duración debe ser un número de segundos.',true);
    if(!redes.length)return toast('Elige al menos una red.',true);
    if(tipo==='Colaboración'&&!v.CREADOR)return toast('Escribe el nombre del creador.',true);
    for(const r of redes){if(linkState(r,v['LINK_'+r])==='bad')return toast(`El link de ${RED_NAME[r]} no parece de esa red.`,true);}
    try{
      await api(edit?'updateVideo':'addVideo',{video:v});
      if(edit){const i=S.videos.findIndex(x=>x.ID_VIDEO===v.ID_VIDEO);S.videos[i]={...S.videos[i],...v};}else S.videos.push({...v,NOTAS:'',CREADO_EN:''});
      buildIndex();toast(edit?'Cambios guardados.':'Video registrado: '+v.ID_VIDEO);
      if(thenCapture)go('capturar',{id:v.ID_VIDEO});else go('buscar',{q:v.ID_VIDEO});
    }catch(e){toast('No se guardó: '+e.message,true);}
  },
  fsSet(k,v){S.fs[k]=v;render();},
  async saveNotes(id){const t=$('#notas').value;try{await api('updateVideo',{video:{ID_VIDEO:id,NOTAS:t}});S.vMap.get(id).NOTAS=t;toast('Nota guardada.');}catch(e){toast('No se guardó: '+e.message,true);}},
  copy(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Copiado.')):toast('Copia manualmente: '+t);},
  rset(k,v){S.rank[k]=v;render();},
  cset(k,v){S.cmp[k]=v;render();},
  exportRank(){const rows=rankRows();const f=RMET[S.rank.metric][0];csv('ranking.csv',[['Pos','ID','Tema','Marca','Red','Fecha','Dur (s)','Corte','Vistas','Alcance','Likes','Interacciones','Engagement %','Retención %'],...rows.map((r,i)=>[i+1,r.v.ID_VIDEO,r.v.TEMA,r.v.MARCA,r.red,fD(r.v.pub),r.v.dur,r.corte,r.n.vis,r.n.alc,r.n.likes,r.inter,r.eng==null?'':r.eng.toFixed(2),r.ret==null?'':r.ret.toFixed(2)])]);},
  exportCmp(){const C=S.cmp;const A=cmpData(C.a,C.aFrom,C.aTo),B=cmpData(C.b,C.bFrom,C.bTo);const r=x=>x==null?'':x;csv('comparativa.csv',[['Métrica','Periodo A '+rangeLbl(A.range),'Periodo B '+rangeLbl(B.range)],['Videos publicados',A.videos,B.videos],['Vistas',A.vis,B.vis],['Alcance',A.alc,B.alc],['Engagement %',r(A.eng&&A.eng.toFixed(2)),r(B.eng&&B.eng.toFixed(2))],['Retención %',r(A.ret&&A.ret.toFixed(2)),r(B.ret&&B.ret.toFixed(2))],['Interacciones',A.inter,B.inter]]);},
  saveDocs(){const o={};['lin','ocf','afz'].forEach(k=>{o[k]=($('#doc_'+k).value||'').trim();});localStorage.setItem('mv_docs',JSON.stringify(o));toast('Link guardado en este navegador.');render();},
  showConnect(){
    $('#modalBox').innerHTML=`<h2>Conexión con tu hoja</h2><p class="sub">Se guarda solo en este navegador. Nada de esto va dentro de la página pública.</p>
    <label class="fl" style="margin-top:12px"><span class="lbl">URL del script (termina en /exec)</span><input class="in" id="c_url" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="fl" style="margin-top:12px"><span class="lbl">Clave</span><input class="in" id="c_tok" type="password" value="${esc(S.cfg.token)}"></label>
    <p style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" onclick="App.connect()">Conectar</button><button class="btn" onclick="App.startDemo()">Modo demo</button><button class="btn" onclick="App.closeModal()">Cerrar</button><button class="btn" onclick="App.disconnect()" style="margin-left:auto">Olvidar conexión</button></p>`;
    $('#modal').classList.add('on');
  },
  closeModal(){$('#modal').classList.remove('on');},
  async connect(){const url=$('#c_url').value.trim(),tok=$('#c_tok').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url))return toast('La URL debe ser la de la aplicación web, terminando en /exec.',true);if(!tok)return toast('Falta la clave.',true);
    S.cfg={url,token:tok};S.demo=false;try{localStorage.setItem('mv_cfg',JSON.stringify(S.cfg));localStorage.removeItem('mv_demo');}catch(e){}App.closeModal();await loadData();if(S.loaded)toast('Conectado.');},
  disconnect(){S.cfg={url:'',token:''};S.loaded=false;S.videos=[];S.metricas=[];buildIndex();try{localStorage.removeItem('mv_cfg');localStorage.removeItem('mv_demo');}catch(e){}App.closeModal();setSync('Sin conexión',false);render();},
  async startDemo(){S.demo=true;makeDemo();try{localStorage.setItem('mv_demo','1');}catch(e){}App.closeModal();await loadData();},
  async init(){
    try{S.cfg=JSON.parse(localStorage.getItem('mv_cfg')||'{"url":"","token":""}');if(localStorage.getItem('mv_demo')){S.demo=true;makeDemo();}}catch(e){}
    renderChrome();
    if(S.demo||(S.cfg.url&&S.cfg.token))await loadData();else render();
  }
};
window.App=App;
document.addEventListener('DOMContentLoaded',App.init);
</script>
